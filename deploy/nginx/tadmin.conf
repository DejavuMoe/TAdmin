# 可选：仅在启用 Mini App（TADMIN_PUBLIC_URL / web.public_url）时需要。
# 放在 http {} 上下文中。TAdmin 后端只监听 127.0.0.1:8080。
limit_req_zone $binary_remote_addr zone=tadmin_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name verify.example.com;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name verify.example.com;

    ssl_certificate     /etc/letsencrypt/live/verify.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verify.example.com/privkey.pem;

    access_log off;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    # Mini App 页面与静态资源
    location ~ ^/(v|assets)/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # 验证 API：按客户端限流
    location ^~ /api/v/ {
        limit_req zone=tadmin_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        return 404;
    }
}
