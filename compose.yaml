# TAdmin — docker compose up -d
# 1) cp .env.example .env  2) cp tadmin.env.example tadmin.env  3) 填写 Token 与 Owner ID
services:
  tadmin:
    build:
      context: .
      args:
        VERSION: ${TADMIN_VERSION:?Copy .env.example to .env}
    image: ${TADMIN_IMAGE:?Copy .env.example to .env}
    restart: unless-stopped
    env_file: ./tadmin.env
    volumes:
      - tadmin-data:/data
      # 可选：挂载配置文件（环境变量已足够时可省略）
      # - ./config.toml:/etc/tadmin/config.toml:ro
    # Mini App（可选）只绑定到本机回环地址，由宿主机上的 Nginx/Caddy 提供 HTTPS。
    ports:
      - "127.0.0.1:${TADMIN_HTTP_PORT:?Set TADMIN_HTTP_PORT in .env}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 256m
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  tadmin-data:
