# TAdmin 项目进度（文档站“进度”页面的唯一数据源）
#
# 每个功能引用的测试名由 `go run ./cmd/docgen` 校验：测试被删除或改名时，
# `go test ./internal/docgen` 会失败，从而保证文档里的“已验证”永远有测试支撑。
#
# status:
#   verified  关键路径有自动化回归，不代表所有边界或真实 Telegram 行为已被证明
#   live      已完成且离线测试通过，但还需要在真实 Telegram 测试群中验收
#   shipped   已在真实 Telegram 验收通过
#   planned   规划中

version = "v0.1.0-dev"
updated = "2026-10-18"
headline = "采用 MIT，Forgejo → GitHub 同步及首次完整 CI 已通过，四项 CodeQL 无告警；真实 Telegram 与服务器试用尚待验收。"

[[milestone]]
title = "TAdmin 2 设计与重写"
date = "2026-09-28"
status = "done"
desc = "从零重写：自研 Bot API 客户端、持久化入群状态机、私聊按钮控制台、频道联动、预览刷新、Mini App。"

[[milestone]]
title = "早期代码审查与回归"
date = "2026-09-28"
status = "done"
desc = "早期修复记录保留；源码候选、复现结果和回归通过分开记录，不再用问题总数声明全面安全。"

[[milestone]]
title = "文档站与“代码即文档”同步"
date = "2026-09-28"
status = "done"
desc = "VitePress 文档站已实现；配置、命令、状态机、数据结构、测试统计与验证码样例由 docgen 从代码生成。"

[[milestone]]
title = "工程基线：CI、Docker 镜像与发布构建"
date = "2026-10-18"
status = "done"
desc = "GitHub CI #2 已通过 Go 质量与竞态、四项 CodeQL、依赖审计、Gitleaks、文档及 AMD64/ARM64 镜像检查。发布流程已配置但尚未执行，没有创建标签或部署服务器。"

[[milestone]]
title = "真实 Telegram 测试群验收"
date = ""
status = "next"
desc = "按运维 → 上线验收清单，用测试群与普通小号走通全部流程，重点验证 Bot API 10.x 临时消息与 Guard。"

[[milestone]]
title = "正式群启用"
date = ""
status = "planned"
desc = "先在一个低风险群启用观察，再逐步接入其他群。"

